<!doctype html>
<!--
  PROTOTYPE — throwaway. Answers "Icon and store imagery" (issue #8):
  which icon direction reads at 16px and signals Lichess -> Chess.com
  transfer without either brand's logo? Four variants, switchable via
  ?variant= (all | A | B | C | D) and the bottom bar / arrow keys.
  Open the file directly in a browser. Not shipped; not production code.
-->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>PROTOTYPE: icon directions</title>
    <style>
      :root {
        --ink: #1d2433;
        --muted: #667085;
        font-family: system-ui, sans-serif;
        color: var(--ink);
      }
      body {
        margin: 0;
        padding: 24px 24px 96px;
        background: #f4f5f7;
      }
      h1 {
        font-size: 18px;
        margin: 0 0 4px;
      }
      h2 {
        font-size: 15px;
        margin: 0 0 4px;
      }
      p {
        margin: 0 0 12px;
        color: var(--muted);
        max-width: 70ch;
      }
      .card {
        background: #fff;
        border-radius: 12px;
        padding: 16px 20px;
        margin-bottom: 16px;
        box-shadow: 0 1px 2px #0001;
      }
      .row {
        display: flex;
        gap: 28px;
        align-items: flex-end;
        flex-wrap: wrap;
      }
      .cell {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 6px;
        font-size: 11px;
        color: var(--muted);
      }
      canvas.px {
        image-rendering: pixelated;
        outline: 1px solid #0002;
      }
      .toolbar {
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 6px 10px;
        border-radius: 8px;
        width: 360px;
      }
      .toolbar.light {
        background: #f0f0f4;
      }
      .toolbar.dark {
        background: #2b2a33;
      }
      .toolbar .url {
        flex: 1;
        height: 22px;
        border-radius: 11px;
        background: #fff;
      }
      .toolbar.dark .url {
        background: #1c1b22;
      }
      .toolbar .ghost {
        width: 16px;
        height: 16px;
        border-radius: 4px;
        background: #8884;
      }
      .toolbar .slot {
        width: 16px;
        height: 16px;
        display: grid;
        place-items: center;
      }
      .store {
        width: 128px;
        height: 128px;
        background: repeating-conic-gradient(#e6e6e6 0 25%, #fff 0 50%) 0 0 /
          16px 16px;
        outline: 1px dashed #0003;
        display: grid;
        place-items: center;
      }
      table.all {
        border-collapse: collapse;
      }
      table.all td,
      table.all th {
        padding: 10px 18px;
        text-align: center;
        vertical-align: middle;
        border-bottom: 1px solid #eee;
      }
      table.all th {
        font-size: 11px;
        color: var(--muted);
        font-weight: 500;
      }
      table.all td.name {
        text-align: left;
        font-weight: 600;
        font-size: 13px;
      }
      #switcher {
        position: fixed;
        bottom: 16px;
        left: 50%;
        transform: translateX(-50%);
        display: flex;
        align-items: center;
        gap: 12px;
        background: #111;
        color: #fff;
        padding: 8px 14px;
        border-radius: 999px;
        box-shadow: 0 6px 20px #0005;
        font-size: 13px;
      }
      #switcher button {
        background: #333;
        color: #fff;
        border: 0;
        border-radius: 50%;
        width: 28px;
        height: 28px;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <h1>PROTOTYPE: icon directions</h1>
    <p>
      Palette is a placeholder (navy + amber) chosen to avoid both brands'
      colours; judge the <em>shape</em>. Pixel views are the SVG rasterised at
      the true size, then magnified ×8 — what a 16px PNG export will actually
      look like.
    </p>
    <main id="root"></main>
    <div id="switcher">
      <button id="prev" aria-label="Previous variant">←</button>
      <span id="label"></span>
      <button id="next" aria-label="Next variant">→</button>
    </div>

    <script>
      const NAVY = '#24305e';
      const LIGHT = '#5b7be0';
      const AMBER = '#f5a524';
      const tile = (fill) =>
        `<rect x="4" y="4" width="120" height="120" rx="26" fill="${fill}"/>`;
      const arrowRight = (fill) =>
        `<path d="M28 52 H72 V32 L104 64 L72 96 V76 H28 Z" fill="${fill}"/>`;

      const VARIANTS = {
        A: {
          name: 'Pawn + arrow',
          why: 'A single piece silhouette on a tile, an arrow heading out. The pawn is the one piece simple enough to survive 16px.',
          svg: `${tile(NAVY)}
            <circle cx="44" cy="40" r="15" fill="#fff"/>
            <rect x="29" y="55" width="30" height="9" rx="4" fill="#fff"/>
            <path d="M35 64 H53 L60 90 H28 Z" fill="#fff"/>
            <rect x="22" y="90" width="44" height="13" rx="5" fill="#fff"/>
            <path d="M70 56 H88 V42 L114 64 L88 86 V72 H70 Z" fill="${AMBER}"/>`,
        },
        B: {
          name: 'Checker, arrow as negative space',
          why: 'A 2×2 board square with the ↗ ‘open elsewhere’ arrow cut out of it, so the toolbar shows through the arrow.',
          svg: `<defs><mask id="mB">
              <rect width="128" height="128" fill="#fff"/>
              <g transform="rotate(-45 64 64)">${arrowRight('#000')}</g>
            </mask></defs>
            <g mask="url(#mB)">
              <rect x="4" y="4" width="120" height="120" rx="26" fill="${LIGHT}"/>
              <path d="M30 4 H64 V64 H4 V30 A26 26 0 0 1 30 4 Z" fill="${NAVY}"/>
              <path d="M64 64 H124 V98 A26 26 0 0 1 98 124 H64 Z" fill="${NAVY}"/>
            </g>`,
        },
        C: {
          name: 'Board → board',
          why: 'Two small boards and an arrow between them: literally ‘this board to that board’. No tile; the most diagrammatic option.',
          svg: `<g>
              <rect x="6" y="6" width="54" height="54" rx="8" fill="${LIGHT}"/>
              <rect x="6" y="6" width="27" height="27" rx="8" fill="${NAVY}"/>
              <rect x="33" y="33" width="27" height="27" rx="8" fill="${NAVY}"/>
              <rect x="20" y="6" width="13" height="27" fill="${NAVY}"/>
              <rect x="33" y="33" width="13" height="27" fill="${NAVY}"/>
            </g>
            <g>
              <rect x="68" y="68" width="54" height="54" rx="8" fill="${LIGHT}"/>
              <rect x="68" y="68" width="27" height="27" rx="8" fill="${NAVY}"/>
              <rect x="95" y="95" width="27" height="27" rx="8" fill="${NAVY}"/>
              <rect x="82" y="68" width="13" height="27" fill="${NAVY}"/>
              <rect x="95" y="95" width="13" height="27" fill="${NAVY}"/>
            </g>
            <path d="M66 26 H84 Q100 26 100 42 V50" fill="none" stroke="${AMBER}" stroke-width="12" stroke-linecap="round"/>
            <path d="M86 46 H114 L100 64 Z" fill="${AMBER}" stroke="${AMBER}" stroke-width="4" stroke-linejoin="round"/>`,
        },
        D: {
          name: 'Monogram',
          why: "Pure typography: L › C. Included to be ruled in or out at 16px; the letters also lean on both brands' initials.",
          svg: `${tile(NAVY)}
            <text x="14" y="88" font-family="system-ui, sans-serif" font-weight="900" font-size="64" fill="#fff">L</text>
            <path d="M54 48 L70 64 L54 80" fill="none" stroke="${AMBER}" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/>
            <text x="70" y="88" font-family="system-ui, sans-serif" font-weight="900" font-size="64" fill="#fff">C</text>`,
        },
      };
      // Round 2: B with white / Lichess black / Chess.com green squares,
      // arrow pointing from the black square (bottom-left) to the green (top-right).
      const LI_BLACK = '#161512';
      const CC_GREEN = '#81b64c';
      const quads = `
        <path d="M30 4 H64 V64 H4 V30 A26 26 0 0 1 30 4 Z" fill="#fff"/>
        <path d="M64 4 H98 A26 26 0 0 1 124 30 V64 H64 Z" fill="${CC_GREEN}"/>
        <path d="M4 64 H64 V124 H30 A26 26 0 0 1 4 98 Z" fill="${LI_BLACK}"/>
        <path d="M64 64 H124 V98 A26 26 0 0 1 98 124 H64 Z" fill="#fff"/>`;
      const ring = `<rect x="5.5" y="5.5" width="117" height="117" rx="24.5" fill="none" stroke="${LI_BLACK}" stroke-width="7"/>`;
      const cutout = (id, extra = '') => `<defs><mask id="${id}">
          <rect width="128" height="128" fill="#fff"/>
          <g transform="rotate(-45 64 64)">${arrowRight('#000')}</g>
        </mask></defs>
        <g mask="url(#${id})">${quads}${extra}</g>`;
      Object.assign(VARIANTS, {
        E: {
          name: 'B2: white/black/green, cut-out arrow',
          why: 'As asked: two white squares, Lichess black bottom-left, Chess.com green top-right, the ↗ arrow cut out from black to green.',
          svg: cutout('mE'),
        },
        F: {
          name: 'B2 + dark ring',
          why: 'Same, with a black ring round the tile so the white squares keep an edge on a light toolbar.',
          svg: cutout('mF', ring),
        },
        G: {
          name: 'B2, solid outlined arrow + ring',
          why: 'Arrow drawn solid white with a black outline instead of cut out, so it never takes on the toolbar colour.',
          svg: `${quads}${ring}
            <g transform="rotate(-45 64 64)">
              <path d="M28 52 H72 V32 L104 64 L72 96 V76 H28 Z" fill="#fff" stroke="${LI_BLACK}" stroke-width="7" stroke-linejoin="round"/>
            </g>`,
        },
      });
      // Round 3: G with A's gold arrow.
      const goldArrow = (
        outline,
        width = 7,
      ) => `<g transform="rotate(-45 64 64)">
          <path d="M28 52 H72 V32 L104 64 L72 96 V76 H28 Z" fill="${AMBER}"${
            outline
              ? ` stroke="${LI_BLACK}" stroke-width="${width}" stroke-linejoin="round"`
              : ''
          }/>
        </g>`;
      Object.assign(VARIANTS, {
        H: {
          name: 'G with gold arrow',
          why: 'G, with the arrow in A’s gold, keeping the black outline.',
          svg: `${quads}${ring}${goldArrow(true)}`,
        },
        I: {
          name: 'G with gold arrow, no outline',
          why: 'Gold arrow without the outline: less busy at 16px, but leans on gold-vs-white contrast.',
          svg: `${quads}${ring}${goldArrow(false)}`,
        },
      });
      // Round 4: H with a thinner outline.
      Object.assign(VARIANTS, {
        J: {
          name: 'H, outline 5',
          why: 'H with the arrow outline thinned from 7 to 5 units (of 128).',
          svg: `${quads}${ring}${goldArrow(true, 5)}`,
        },
        K: {
          name: 'H, outline 4',
          why: 'H with the arrow outline thinned to 4 units: about half a pixel at 16px.',
          svg: `${quads}${ring}${goldArrow(true, 4)}`,
        },
      });
      const KEYS = ['all', ...Object.keys(VARIANTS)];

      const svgDoc = (k) =>
        `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">${VARIANTS[k].svg}</svg>`;
      const dataUrl = (k) =>
        'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(svgDoc(k));
      const img = (k, size) =>
        `<img src="${dataUrl(k)}" width="${size}" height="${size}" alt="">`;

      // True-size raster, magnified — what the exported PNG will look like.
      function pixelCanvas(k, size, zoom = 8, bg = null) {
        const c = document.createElement('canvas');
        c.width = size;
        c.height = size;
        c.className = 'px';
        c.style.width = c.style.height = size * zoom + 'px';
        const ctx = c.getContext('2d');
        const i = new Image();
        i.onload = () => {
          if (bg) {
            ctx.fillStyle = bg;
            ctx.fillRect(0, 0, size, size);
          }
          ctx.drawImage(i, 0, 0, size, size);
        };
        i.src = dataUrl(k);
        return c;
      }

      const toolbar = (k, theme) => `
        <div class="toolbar ${theme}">
          <span class="ghost"></span><span class="ghost"></span>
          <span class="url"></span>
          <span class="ghost"></span>
          <span class="slot">${img(k, 16)}</span>
          <span class="ghost"></span>
        </div>`;

      function renderOne(k) {
        const v = VARIANTS[k];
        root.innerHTML = `
          <section class="card"><h2>${k} — ${v.name}</h2><p>${v.why}</p></section>
          <section class="card"><h2>In the toolbar (16 CSS px)</h2>
            <div class="row">${toolbar(k, 'light')}${toolbar(k, 'dark')}</div></section>
          <section class="card"><h2>True pixels, ×8</h2>
            <div class="row" id="px"></div></section>
          <section class="card"><h2>Store icon — 96px artwork in a 128px canvas</h2>
            <div class="row">
              <div class="cell"><div class="store">${img(k, 96)}</div>CWS 128 (16px padding)</div>
              <div class="cell">${img(k, 128)}AMO 128</div>
            </div></section>`;
        const px = document.getElementById('px');
        for (const [size, bg, label] of [
          [16, '#f0f0f4', '16 light'],
          [16, '#2b2a33', '16 dark'],
          [24, '#f0f0f4', '24'],
          [32, '#f0f0f4', '32'],
        ]) {
          const cell = document.createElement('div');
          cell.className = 'cell';
          cell.append(pixelCanvas(k, size, size === 16 ? 8 : 6, bg), label);
          px.append(cell);
        }
      }

      function renderAll() {
        root.innerHTML = `<section class="card"><h2>All directions side by side</h2>
          <p>Columns at 16 and 32 are true-pixel rasters (×4) on light and dark toolbars; 128 is the browser rendering.</p>
          <table class="all"><thead><tr><th></th><th>16 light</th><th>16 dark</th>
          <th>32 light</th><th>32 dark</th><th>128</th><th>toolbar</th></tr></thead>
          <tbody id="rows"></tbody></table></section>`;
        const rows = document.getElementById('rows');
        for (const k of Object.keys(VARIANTS)) {
          const tr = document.createElement('tr');
          const name = document.createElement('td');
          name.className = 'name';
          name.textContent = `${k} — ${VARIANTS[k].name}`;
          tr.append(name);
          for (const [size, bg] of [
            [16, '#f0f0f4'],
            [16, '#2b2a33'],
            [32, '#f0f0f4'],
            [32, '#2b2a33'],
          ]) {
            const td = document.createElement('td');
            td.append(pixelCanvas(k, size, 4, bg));
            tr.append(td);
          }
          const big = document.createElement('td');
          big.innerHTML = img(k, 128);
          const tb = document.createElement('td');
          tb.innerHTML = toolbar(k, 'light') + '<br>' + toolbar(k, 'dark');
          tr.append(big, tb);
          rows.append(tr);
        }
      }

      const root = document.getElementById('root');
      function render() {
        let k = new URLSearchParams(location.search).get('variant') ?? 'all';
        if (!KEYS.includes(k)) k = 'all';
        document.getElementById('label').textContent =
          k === 'all' ? 'All' : `${k} (${VARIANTS[k].name})`;
        k === 'all' ? renderAll() : renderOne(k);
        return k;
      }
      function go(step) {
        const cur = KEYS.indexOf(render());
        const next = KEYS[(cur + step + KEYS.length) % KEYS.length];
        const u = new URL(location.href);
        u.searchParams.set('variant', next);
        history.replaceState(null, '', u);
        render();
      }
      document.getElementById('prev').onclick = () => go(-1);
      document.getElementById('next').onclick = () => go(1);
      addEventListener('keydown', (e) => {
        if (e.target.closest?.('input, textarea, [contenteditable]')) return;
        if (e.key === 'ArrowLeft') go(-1);
        if (e.key === 'ArrowRight') go(1);
      });
      render();
    </script>
  </body>
</html>
