name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Never cancel a release halfway through publishing.
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
      - run: pnpm typecheck
      # ESLint, Prettier, and `web-ext lint`: the addons-linter that AMO's own
      # validation runs.
      - run: pnpm lint
      - run: pnpm test

  smoke:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
      - run: pnpm build:chrome
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm exec playwright test

  package:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
      # The Chrome zip, the Firefox zip and the AMO sources zip.
      - run: pnpm zip
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: packages
          path: .output/*.zip
          if-no-files-found: error

  # Rebuilds the Firefox package from the sources zip, the way AMO's reviewers
  # do, and fails on any difference. Arm64, because the README promises any
  # architecture and x86_64 has been verified by hand.
  reproducibility:
    needs: package
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: packages
          path: packages
      - name: Rebuild from the sources zip with only the README's commands
        run: |
          docker run --rm -v "$PWD/packages:/packages" node:24.14.0 bash -euo pipefail -c '
            apt-get update -qq && apt-get install -y -qq unzip > /dev/null
            unzip -q /packages/*-firefox.zip -d /shipped
            unzip -q /packages/*-sources.zip -d /src
            cd /src
            npm install -g pnpm@12.16.1
            pnpm install --frozen-lockfile
            pnpm build:firefox
            diff -r /shipped .output/firefox-mv3
          '

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [check, smoke, package, reproducibility]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: The tag matches package.json
        run: |
          expected="v$(node -p "require('./package.json').version")"
          if [ "$GITHUB_REF_NAME" != "$expected" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match package.json ($expected)"
            exit 1
          fi
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: packages
          path: packages
      - run: gh release create "$GITHUB_REF_NAME" packages/*.zip --verify-tag --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}

  # The store jobs only update listings that already exist: neither store's
  # first submission is made from CI. Each stays skipped until its repository
  # variable says the listing exists.
  publish-chrome:
    if: vars.CHROME_EXTENSION_ID != ''
    needs: release
    runs-on: ubuntu-24.04
    environment: stores
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: packages
          path: packages
      # Uploads, then submits for review. The Chrome Web Store API (v2) cannot
      # create an item, so an unknown id fails here.
      - run: >-
          pnpm exec chrome-webstore-upload
          --source packages/*-chrome.zip
          --extension-id "$EXTENSION_ID"
          --publisher-id "$PUBLISHER_ID"
        env:
          EXTENSION_ID: ${{ vars.CHROME_EXTENSION_ID }}
          PUBLISHER_ID: ${{ secrets.CWS_PUBLISHER_ID }}
          CLIENT_ID: ${{ secrets.CWS_CLIENT_ID }}
          CLIENT_SECRET: ${{ secrets.CWS_CLIENT_SECRET }}
          REFRESH_TOKEN: ${{ secrets.CWS_REFRESH_TOKEN }}

  publish-firefox:
    if: vars.AMO_LISTED == 'true'
    needs: release
    runs-on: ubuntu-24.04
    environment: stores
    env:
      AMO_JWT_ISSUER: ${{ secrets.AMO_JWT_ISSUER }}
      AMO_JWT_SECRET: ${{ secrets.AMO_JWT_SECRET }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: packages
          path: packages
      - run: unzip -q packages/*-firefox.zip -d firefox
      # `web-ext sign --channel listed` with an unknown GUID silently creates
      # a new listing instead of failing.
      - run: node scripts/check-amo-listing.js firefox/manifest.json
      # Submits for review and returns without waiting for approval.
      - run: >-
          pnpm exec web-ext sign
          --channel listed
          --source-dir firefox
          --upload-source-code packages/*-sources.zip
          --approval-timeout 0
          --api-key "$AMO_JWT_ISSUER"
          --api-secret "$AMO_JWT_SECRET"
